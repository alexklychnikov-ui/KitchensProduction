services:
  postgres:
    image: postgres:16-alpine
    container_name: kitchens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitchens
      POSTGRES_PASSWORD: kitchens
      POSTGRES_DB: kitchens_bot
    ports:
      - "5433:5432"
    volumes:
      - kitchens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchens -d kitchens_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kitchens_pgdata:
